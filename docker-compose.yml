version: '3.8'

services:
  streamlit-app:
    build: .
    container_name: financial-analyzer-ui
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - STREAMLIT_SERVER_PORT=8501
    depends_on:
      - langflow

  langflow:
    image: langflowai/langflow:latest
    container_name: langflow-dashboard
    ports:
      - "7860:7860"
    command: ["langflow", "run", "--host", "0.0.0.0", "--port", "7860"]
